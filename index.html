<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="蜕变">
<meta name="description" content="蜕变：六维打卡、语音带练、数据自动备份。身体、心力、事业、关系、秩序、见识。">
<title>蜕变</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand"><span class="logo">蜕</span>蜕变<small>每天五件</small></div>
    <div class="slogan">先完成，再完美。</div>
    <div class="topright" id="topDate">—</div>
  </header>

  <section id="tab-today" class="tab on">
    <div class="hero" id="hero"></div>
    <div id="sixGrid"></div>
    <div id="statusCard"></div>
    <div id="threeCard"></div>
    <div id="tipCard"></div>
  </section>

  <section id="tab-train" class="tab">
    <div id="trainCard"></div>
    <div id="trainMoves"></div>
    <div id="exLibCard"></div>
    <div id="trainHistory"></div>
  </section>

  <section id="tab-learn" class="tab">
    <div id="learnCard"></div>
    <div id="learnPlan"></div>
  </section>

  <section id="tab-diet" class="tab">
    <div id="calCard"></div>
    <div id="mealCard"></div>
    <div id="foodCard"></div>
    <div id="dietNoteCard"></div>
  </section>

  <section id="tab-badge" class="tab">
    <div id="badgeStats"></div>
    <div id="badgeGrid"></div>
      <div id="extraCards"></div>
    <div id="chartCard"></div>
  </section>

  <section id="tab-me" class="tab">
    <div id="meCard"></div>
    <div id="rulesCard"></div>
    <div id="voiceCard"></div>
    <div id="dataCard"></div>
    <div class="hint" style="text-align:center;padding:16px 0 6px">依据《高性价比人生指南》· 不做医疗诊断，身体不适请看医生</div>
  </section>

</div>

<nav class="nav">
  <button data-tab="tab-today" class="on"><span class="ico">◎</span>今天</button>
  <button data-tab="tab-train"><span class="ico">▶</span>训练</button>
  <button data-tab="tab-learn"><span class="ico">✦</span>学习</button>
  <button data-tab="tab-me"><span class="ico">☰</span>我</button>
</nav>

<div class="player" id="player">
  <div class="p-top">
    <div class="p-title" id="pTitle">—</div>
    <button class="p-close" id="pClose">✕</button>
  </div>
  <div class="p-main">
    <div class="p-big" id="pBig">准备开始</div>
    <div class="p-sub" id="pSub"></div>
  </div>
  <div class="p-progress"><i id="pBar"></i></div>
  <div class="p-safety">胸痛、头晕、喘不上气、腿麻、腹痛加重 → 立刻停；持续不缓解打 120</div>
  <div class="p-row">
    <button class="p-mini" id="pMusic">♪ 音乐</button>
    <div class="p-note" id="pNote">屏幕自动常亮</div>
  </div>
  <div class="p-controls">
    <button id="pStop">结束</button>
    <button class="main" id="pPause">暂停</button>
  </div>
</div>

<div id="bootFallback" style="display:none;margin:16px;padding:16px;border-radius:16px;background:#3a2318;border:1px solid #7a4a1f;color:#ffd9a0;font-size:14px;line-height:1.7">
  <b>App 没加载出来</b><br>
  1. 下拉刷新一次，或换个网络再试<br>
  2. 地址：<a href="https://dawodgrimes201-hue.github.io/tuibian/" style="color:#ffd980;font-weight:700">dawodgrimes201-hue.github.io/tuibian/</a><br>
  3. 数据不会丢，云端有备份。
</div>
<script>
setTimeout(function () {
  var ok = document.querySelector('#hero .v3home') || document.querySelector('#hero .card');
  if (!ok) { var f = document.getElementById('bootFallback'); if (f) f.style.display = 'block'; }
}, 5000);
</script>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>
<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">

<script src="data.js"></script>
<script src="coach.js"></script>
<script src="rules.js"></script>
<script src="voice.js"></script>
<script src="app.js"></script>
</body>
</html>
